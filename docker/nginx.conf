server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serve pre-compressed assets when the client accepts them.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely and are safe to serve immutably.
    location /assets/ {
        # Single Cache-Control header only -- `expires` would emit a second,
        # competing one alongside add_header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: unknown paths render the app instead of a 404, so
    # client-side routes survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak the nginx version in error pages / headers.
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
